<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pelada Vibra - PRO</title>
    <style>
        :root { --primary: #1b5e20; --accent: #2962ff; --bg: #f0f2f5; --white: #ffffff; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 10px; 
            color: #333;
            line-height: 1.4;
        }

        .container { max-width: 1000px; margin: auto; }
        
        /* Ajuste das Abas para Mobile */
        .tabs { 
            display: flex; 
            gap: 5px; 
            margin-bottom: 15px; 
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            padding: 5px 0;
        }
        .tab-btn { 
            flex: 1; 
            padding: 15px 5px; 
            cursor: pointer; 
            border: none; 
            background: #ccc; 
            border-radius: 8px; 
            font-weight: bold;
            font-size: 14px;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        .content-section { display: none; background: var(--white); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .content-section.active { display: block; }

        /* Formulário Adaptável */
        .input-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            margin-bottom: 20px; 
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        @media (min-width: 600px) {
            .input-grid { grid-template-columns: 2fr 1fr 1fr auto; }
        }

        .row-mobile { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        input, select, .btn-add { 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 16px; /* Evita zoom automático no iOS */
            width: 100%;
        }
        
        .btn-add { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }

        /* Tabela Responsiva */
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; }
        th { background: #eee; padding: 12px 8px; text-align: left; font-size: 13px; }
        td { padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 14px; }
        
        /* Chips de Seleção no Celular */
        .selection-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 8px; 
            margin: 15px 0; 
        }
        .player-chip { 
            display: flex; 
            flex-direction: column;
            justify-content: center;
            align-items: center; 
            padding: 12px 8px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            background: #fff;
            text-align: center;
        }
        .player-chip.selected { background: #e8f5e9; border-color: var(--primary); border-width: 2px; }
        .player-chip b { font-size: 14px; margin-bottom: 4px; }
        .player-chip small { font-size: 11px; color: #666; }

        /* Times no Celular */
        .teams-container { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 15px; 
            margin-top: 20px; 
        }
        @media (min-width: 768px) {
            .teams-container { grid-template-columns: 1fr 1fr; }
        }

        .team-card { 
            background: white; 
            border-radius: 12px; 
            padding: 15px; 
            border-top: 6px solid var(--primary); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        .p-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; }
        
        .btn-draw { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 18px; 
            border-radius: 50px; 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%; 
            margin: 20px 0;
            box-shadow: 0 4px 12px rgba(41, 98, 255, 0.3);
        }

        .btn-whatsapp { 
            background: #25d366; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 10px; 
            font-weight: bold; 
            width: 100%; 
            margin-bottom: 30px;
            display: none; 
        }

        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; }
        .bg-def { background: #d32f2f; } .bg-mei { background: #1976d2; } .bg-atk { background: #388e3c; }
        .avg-label { text-align: right; margin-top: 10px; font-weight: bold; color: var(--accent); font-size: 14px; }
        
        .backup-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-sub { flex: 1; padding: 10px; font-size: 12px; background: white; border: 1px solid #999; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('gestao')">⚙️ ELENCO</button>
        <button class="tab-btn" onclick="openTab('jogo')">🏟️ SORTEIO</button>
    </div>

    <section id="gestao" class="content-section active">
        <div class="input-grid">
            <input type="hidden" id="editId">
            <input type="text" id="pName" placeholder="Nome do Jogador">
            <div class="row-mobile">
                <select id="pPos">
                    <option value="Defensor">Defensor</option>
                    <option value="Meia">Meia</option>
                    <option value="Atacante">Atacante</option>
                </select>
                <input type="number" id="pNote" step="0.5" min="1" max="5" value="3.0">
            </div>
            <button class="btn-add" onclick="savePlayer()" id="btnSave">ADICIONAR</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('name')">NOME ↕</th>
                        <th onclick="sortTable('pos')">POS ↕</th>
                        <th onclick="sortTable('note')">NOTA ↕</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="baseBody"></tbody>
            </table>
        </div>

        <div class="backup-btns">
            <button class="btn-sub" onclick="exportJSON()">📥 BACKUP</button>
            <button class="btn-sub" onclick="importJSON()">📤 RESTAURAR</button>
        </div>
    </section>

    <section id="jogo" class="content-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <b id="counterLabel">Selecionados: 0/24</b>
            <button onclick="clearSelect()" style="background:none; border:1px solid #ccc; border-radius:5px; padding:5px 10px; font-size:12px;">Limpar</button>
        </div>
        
        <div class="selection-grid" id="selectionGrid"></div>

        <button class="btn-draw" id="drawBtn" onclick="drawTeams()" disabled>SORTEAR TIMES</button>

        <div class="teams-container" id="results"></div>
        <button id="btnWhatsapp" class="btn-whatsapp" onclick="copyForWhatsapp()">📋 COPIAR ESCALAÇÃO (WHATSAPP)</button>
    </section>
</div>

<script>
    let players = JSON.parse(localStorage.getItem('racha_v51_db')) || [];
    let sortState = { field: 'name', asc: true };
    let lastResultText = "";

    function openTab(tabId) {
        document.querySelectorAll('.content-section, .tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(tabId === 'jogo') renderSelection();
    }

    function saveToStore() {
        localStorage.setItem('racha_v51_db', JSON.stringify(players));
        renderBase();
    }

    function savePlayer() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('pName').value.trim();
        const pos = document.getElementById('pPos').value;
        const note = parseFloat(document.getElementById('pNote').value);
        if(!name) return;
        if(id) {
            const i = players.findIndex(p => p.id == id);
            players[i] = { ...players[i], name, pos, note };
            document.getElementById('editId').value = "";
            document.getElementById('btnSave').innerText = "ADICIONAR";
        } else {
            if(players.length >= 36) return alert("Limite 36 atingido");
            players.push({ id: Date.now(), name, pos, note, active: false });
        }
        document.getElementById('pName').value = "";
        saveToStore();
    }

    function editPlayer(id) {
        const p = players.find(x => x.id === id);
        document.getElementById('editId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPos').value = p.pos;
        document.getElementById('pNote').value = p.note;
        document.getElementById('btnSave').innerText = "SALVAR";
        window.scrollTo(0,0);
    }

    function deletePlayer(id) {
        if(confirm("Excluir jogador?")) { players = players.filter(x => x.id !== id); saveToStore(); }
    }

    function sortTable(field) {
        sortState.asc = (sortState.field === field) ? !sortState.asc : true;
        sortState.field = field;
        renderBase();
    }

    function renderBase() {
        const body = document.getElementById('baseBody');
        body.innerHTML = "";
        let sorted = [...players].sort((a, b) => {
            let vA = a[sortState.field], vB = b[sortState.field];
            if(typeof vA === 'string') return sortState.asc ? vA.localeCompare(vB) : vB.localeCompare(vA);
            return sortState.asc ? vA - vB : vB - vA;
        });
        sorted.forEach(p => {
            body.innerHTML += `<tr>
                <td><b>${p.name}</b></td>
                <td><span class="badge ${p.pos=='Defensor'?'bg-def':p.pos=='Meia'?'bg-mei':'bg-atk'}">${p.pos[0]}</span></td>
                <td>${p.note.toFixed(1)}</td>
                <td>
                    <button onclick="editPlayer(${p.id})" style="border:none; background:none; font-size:18px;">✏️</button>
                    <button onclick="deletePlayer(${p.id})" style="border:none; background:none; font-size:18px;">🗑️</button>
                </td>
            </tr>`;
        });
    }

    function renderSelection() {
        const grid = document.getElementById('selectionGrid');
        grid.innerHTML = "";
        players.sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            grid.innerHTML += `
                <div class="player-chip ${p.active?'selected':''}" onclick="toggleP(${p.id})">
                    <b>${p.name}</b>
                    <small>${p.pos} • ${p.note.toFixed(1)}</small>
                </div>`;
        });
        const count = players.filter(x => x.active).length;
        document.getElementById('counterLabel').innerText = `Selecionados: ${count}/24`;
        document.getElementById('drawBtn').disabled = count < 12;
    }

    function toggleP(id) {
        const p = players.find(x => x.id === id);
        if(!p.active && players.filter(x => x.active).length >= 24) return;
        p.active = !p.active;
        saveToStore();
        renderSelection();
    }

    function clearSelect() {
        players.forEach(p => p.active = false);
        saveToStore();
        renderSelection();
    }

    function drawTeams() {
        const activeOnes = players.filter(p => p.active);
        const total = activeOnes.length;
        const numTeams = Math.ceil(total / 6);
        const teams = Array.from({ length: numTeams }, () => []);
        
        const targets = Array(numTeams).fill(6);
        if (total % 6 !== 0) targets[numTeams - 1] = total % 6;

        const sortPote = (arr) => arr.sort((a,b) => (b.note - a.note) || (Math.random() - 0.5));

        const potes = {
            Atacante: sortPote(activeOnes.filter(p => p.pos === 'Atacante')),
            Defensor: sortPote(activeOnes.filter(p => p.pos === 'Defensor')),
            Meia: sortPote(activeOnes.filter(p => p.pos === 'Meia'))
        };

        const regras = [{p:'Atacante', q:1}, {p:'Defensor', q:2}, {p:'Meia', q:3}];
        let reverse = false;

        regras.forEach(regra => {
            const pool = potes[regra.p];
            for(let i=0; i < regra.q; i++) {
                let order = Array.from({length: numTeams}, (_,idx) => idx);
                if(reverse) order.reverse();
                order.forEach(tIdx => {
                    if(pool.length > 0 && teams[tIdx].length < targets[tIdx]) {
                        teams[tIdx].push(pool.shift());
                    }
                });
                reverse = !reverse;
            }
        });

        const rest = sortPote([...potes.Atacante, ...potes.Defensor, ...potes.Meia]);
        rest.forEach(p => {
            const t = teams.find((x, idx) => x.length < targets[idx]);
            if(t) t.push(p);
        });

        renderResults(teams);
    }

    function renderResults(teams) {
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = "";
        let textWhatsApp = "*⚽ PELADA VIBRA - ESCALAÇÃO*\n\n";

        teams.forEach((t, i) => {
            const avg = (t.reduce((a,b)=>a+b.note,0) / t.length).toFixed(2);
            textWhatsApp += `*TIME ${i+1}* (Média: ${avg})\n`;
            
            resDiv.innerHTML += `
                <div class="team-card ${t.length < 6 ? 'incomplete' : ''}">
                    <h3>Time ${i+1} <small>(${t.length}/6)</small></h3>
                    ${t.map(p => {
                        textWhatsApp += `- ${p.name} (${p.pos[0]})\n`;
                        return `<div class="p-row">
                            <span class="badge ${p.pos=='Defensor'?'bg-def':p.pos=='Meia'?'bg-mei':'bg-atk'}">${p.pos[0]}</span>
                            <span>${p.name}</span> <b>${p.note.toFixed(1)}</b>
                        </div>`;
                    }).join('')}
                    <div class="avg-label">Média Técnica: ${avg}</div>
                </div>
            `;
            textWhatsApp += `\n`;
        });

        lastResultText = textWhatsApp;
        document.getElementById('btnWhatsapp').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function copyForWhatsapp() {
        navigator.clipboard.writeText(lastResultText).then(() => {
            alert("Copiado! Agora cole no seu grupo.");
        });
    }

    function exportJSON() {
        const blob = new Blob([JSON.stringify(players)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = "racha_backup.json"; a.click();
    }

    function importJSON() {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.onchange = e => {
            const reader = new FileReader();
            reader.onload = ev => { players = JSON.parse(ev.target.result); saveToStore(); alert("Backup Restaurado!"); };
            reader.readAsText(e.target.files[0]);
        };
        inp.click();
    }

    renderBase();
</script>
</body>
</html>
